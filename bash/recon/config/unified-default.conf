#!/usr/bin/env bash
# =============================================================================
# NAME         : unified-default.conf
# DESCRIPTION  : Balanced profile for run_recon.sh. Source via --config.
# AUTHOR       : Adam Compton
# =============================================================================

# Phase selection (space-separated). dns-email / cloud are opt-in.
RECON_DEFAULT_PHASES="00-validate 01-osint 04-portscan 05-web 06-vuln 07-report"

# Engine and concurrency.
RECON_ENGINE="nmap"
RECON_THREADS=50
RECON_MAX_HOSTS=8192
NMAP_TIMING=4

# nmap depth.
NMAP_FULL_TCP=0
NMAP_UDP=0
NMAP_NSE_ENABLED=1
NMAP_NSE_SCRIPTS="vuln"

# Discovery ports (IP->domain techniques).
RECON_TLS_PORTS="443,8443,993,995,465,636"
RECON_WEB_PORTS="80,443,8080,8443"
RECON_SMTP_PORTS="25,587,2525"
RECON_WHOIS_MAX=64

# gowitness tuning (v3).
GW_THREADS=40
GW_TIMEOUT=10
GW_DELAY=2
GW_ALL_PORTS=0
GW_TRUST=0

# nuclei.
RECON_NUCLEI_SEVERITY="critical,high,medium,low,info"
RECON_NUCLEI_RATE_LIMIT=150

# Optional integrations (off by default).
MSF_ENABLED=0
RECON_TESTSSL_ENABLED=0

# New tool knobs (naabu engine, tldfinder/urlfinder auto if installed, vulnx).
NAABU_TOP_PORTS=1000
NAABU_RATE=1000
VULNX_ENABLED=1
