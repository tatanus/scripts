# shellcheck shell=bash disable=SC2034
###############################################################################
# NAME         : default.conf
# DESCRIPTION  : Default configuration for run_internal_pentest.sh . Sourced by
#                the orchestrator before tasks run. Every value here mirrors a
#                default already set in internal_lib.sh - uncomment and edit to
#                override. This file is auto-loaded when present; pass a
#                different file with --config to override it entirely.
# AUTHOR       : Adam Compton
###############################################################################

#------------------------------------------------------------------------------
# Directory layout (defaults follow /root/DATA/... from pentest_setup).
#------------------------------------------------------------------------------
# DATA_DIR="${HOME}/DATA"
# RECON_DIR="${DATA_DIR}/RECON"
# OUTPUT_DIR="${DATA_DIR}/OUTPUT"
# TOOLS_DIR="${DATA_DIR}/TOOLS"

#------------------------------------------------------------------------------
# Input files.
#------------------------------------------------------------------------------
# TARGETS_FILE="${RECON_DIR}/targets.txt"
# EXCLUDES_FILE="${RECON_DIR}/excludes.txt"
# DOMAINS_FILE="${RECON_DIR}/domains.txt"

#------------------------------------------------------------------------------
# Tool locations.
#------------------------------------------------------------------------------
# SPOONMAP_DIR="${TOOLS_DIR}/spoonmap"
# MSF_SCRIPTS_DIR="${TOOLS_DIR}/SCRIPTS/MSF"

#------------------------------------------------------------------------------
# Tunables.
#------------------------------------------------------------------------------
# MSF_THREADS="10"

# Space/glob filters for the 08-msf-modules task (basename globs). Leave
# INCLUDE empty to run every *.rc under MSF_SCRIPTS_DIR/modules.
# MSF_MODULES_INCLUDE=""          # e.g. "smb_* ftp_*"
# MSF_MODULES_EXCLUDE=""          # e.g. "cve_2019_0708_bluekeep"

#------------------------------------------------------------------------------
# Per-task enable / require overrides (task name = tasks/<name>.sh basename).
# Enabled defaults to true for every discovered task; only 00-validate is
# required (fatal on failure) by default.
#------------------------------------------------------------------------------
# TASK_ENABLED["01-excludes"]=false
# TASK_REQUIRED["04-spoonmap"]=true
